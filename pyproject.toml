[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moraine-home"
version = "0.3.0b2"
description = "A local-first memory workbench for personal AI agents"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = ["fastembed==0.7.4", "numpy>=1.26,<3"]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]

[project.scripts]
moraine = "moraine.server:main"
moraine-beta = "moraine.beta_server:main"
moraine-mcp = "moraine.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
moraine = ["static/*", "data/*.json"]
